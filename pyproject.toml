[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional"
version = "0.1.0"
authors = [
  { name="isantosruiz" },
]
description = "A native fractional calculus extension for SymPy implementing Riemann-Liouville symbolic subroutines."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mpmath>=1.3",
    "sympy>=1.12",
]

[project.urls]
Repository = "https://github.com/isantosruiz/fractional"
Issues = "https://github.com/isantosruiz/fractional/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
